<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A.S. — ordinary streets.</title>
<style>
  body { background:#0b0d10; color:#e8e6e1; font-family:Georgia, serif; margin:0; padding:40px; }
  h2 { font-size:2.5rem; margin-bottom:4px; }
  .sub-label { font-family:monospace; color:#888; font-size:0.85rem; margin:20px 0 6px; letter-spacing:1px; }
  .tabs { display:flex; flex-wrap:wrap; gap:10px; font-family:monospace; margin-bottom:10px; }
  .tab { border:1px solid #444; padding:8px 16px; cursor:pointer; background:transparent; color:#ccc; letter-spacing:1px; font-size:0.85rem; }
  .tab.active { background:#c8672f; border-color:#c8672f; color:#111; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:2px; margin-top:24px; }
  .frame { position:relative; aspect-ratio:3/4; overflow:hidden; background:#111; }
  .frame img { width:100%; height:100%; object-fit:cover; display:block; }
  .frame .num { position:absolute; top:10px; left:10px; font-family:monospace; color:#888; font-size:0.8rem; }
  .frame .cap { position:absolute; bottom:10px; left:10px; font-family:monospace; font-size:0.85rem; color:#eee; background:rgba(0,0,0,0.5); padding:2px 8px; }
  .empty { font-family:monospace; color:#666; padding:40px 0; }
</style>
</head>
<body>

<h2>Selected Work</h2>

<div class="sub-label">LOCATION</div>
<div class="tabs" id="tabs-location"></div>

<div class="sub-label">TYPE</div>
<div class="tabs" id="tabs-genre"></div>

<div class="grid" id="grid"></div>

<script>
// ---- 1. YOUR PHOTO DATA ----
// One object per photo. Add a new entry every time you shoot — date controls order automatically.
// region  = one of the LOCATIONS keys below
// genre   = "street" | "architecture" | "travel"
// city    = shown in the caption, so you keep the specific place even though the tab is province-level
const photos = [
  { file: "downtown-moncton-blue-hour.jpg", title: "Downtown Moncton, Blue Hour", city: "Moncton", region: "nb", genre: "architecture", date: "2026-07-20" },
  { file: "mississauga-01.jpg",             title: "Mississauga Skyline",         city: "Mississauga", region: "on", genre: "architecture", date: "2026-06-15" },
  // Add more entries here — order in this list doesn't matter, the code sorts it.
];

// ---- 2. LOCATION TABS (province / state / country tier — keep this consistent) ----
const locations = [
  { key: "all", label: "ALL" },
  { key: "nb",  label: "NEW BRUNSWICK" },
  { key: "ns",  label: "NOVA SCOTIA" },
  { key: "pe",  label: "PRINCE EDWARD ISLAND" },
  { key: "on",  label: "ONTARIO" },
  { key: "ab",  label: "ALBERTA" },
  { key: "usa", label: "USA" },
  { key: "in",  label: "INDIA" },
];

// ---- 3. GENRE TABS ----
const genres = [
  { key: "all", label: "ALL" },
  { key: "street", label: "STREET" },
  { key: "architecture", label: "ARCHITECTURE" },
  { key: "travel", label: "TRAVEL" },
];

let activeLocation = "all";
let activeGenre = "all";

function render() {
  const sorted = [...photos].sort((a, b) => new Date(b.date) - new Date(a.date));

  const filtered = sorted.filter(p =>
    (activeLocation === "all" || p.region === activeLocation) &&
    (activeGenre === "all" || p.genre === activeGenre)
  );

  document.getElementById("tabs-location").innerHTML = locations.map(l => `
    <button class="tab ${l.key === activeLocation ? "active" : ""}" onclick="setLocation('${l.key}')">${l.label}</button>
  `).join("");

  document.getElementById("tabs-genre").innerHTML = genres.map(g => `
    <button class="tab ${g.key === activeGenre ? "active" : ""}" onclick="setGenre('${g.key}')">${g.label}</button>
  `).join("");

  document.getElementById("grid").innerHTML = filtered.length
    ? filtered.map((p, i) => `
        <div class="frame">
          <img src="images/${p.file}" alt="${p.title}" loading="lazy">
          <span class="num">${String(i + 1).padStart(2, "0")}</span>
          <span class="cap">${p.title}</span>
        </div>
      `).join("")
    : `<div class="empty">No frames yet for this combination.</div>`;
}

function setLocation(key) { activeLocation = key; render(); }
function setGenre(key) { activeGenre = key; render(); }

render();
</script>
</body>
</html>
