<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A.S. — ordinary streets.</title>
<style>
  * { box-sizing: border-box; }
  body { background:#0b0d10; color:#e8e6e1; font-family:Georgia, 'Times New Roman', serif; margin:0; }
  a { color:inherit; text-decoration:none; }

  header { display:flex; justify-content:space-between; align-items:center; padding:24px 40px; flex-wrap:wrap; gap:16px; }
  .logo { font-size:1.3rem; letter-spacing:2px; }
  nav { display:flex; gap:28px; font-family:monospace; font-size:0.85rem; letter-spacing:1px; color:#ccc; }
  nav a:hover { color:#c8672f; }

  .hero { padding:20px 40px 40px; }
  .hero h1 { font-size:4rem; margin:0; line-height:1.1; }
  .hero h1 .accent { font-style:italic; color:#e8a15c; }
  .hero p { max-width:520px; color:#bbb; font-size:1.1rem; margin-top:20px; }
  .gear { text-align:right; font-family:monospace; color:#888; font-size:0.85rem; margin-top:-40px; padding-right:40px; }

  main { padding:40px; }
  h2 { font-size:2.5rem; margin-bottom:4px; }
  .sub-label { font-family:monospace; color:#888; font-size:0.85rem; margin:20px 0 6px; letter-spacing:1px; }
  .tabs { display:flex; flex-wrap:wrap; gap:10px; font-family:monospace; margin-bottom:10px; }
  .tab { border:1px solid #444; padding:8px 16px; cursor:pointer; background:transparent; color:#ccc; letter-spacing:1px; font-size:0.85rem; }
  .tab.active { background:#c8672f; border-color:#c8672f; color:#111; }
  .tab.goto { border-style:dashed; }
  .tab.goto .chevron { display:inline-block; margin-left:6px; transition:transform 0.15s ease; }
  .tab.goto.open .chevron { transform:rotate(180deg); }

  .tabs-month { display:none; flex-wrap:wrap; gap:10px; font-family:monospace; margin:0 0 20px; padding:14px; border:1px dashed #444; }
  .tabs-month.open { display:flex; }
  .tabs-month .tab { border-color:#555; }

  /* Fixed 6-across grid, every tile the same size/ratio */
  .grid {
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap:6px;
    margin-top:24px;
  }
  .frame {
    position:relative;
    aspect-ratio: 3/4;
    background:#111;
    overflow:hidden;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* object-fit: contain keeps the whole photo visible, centered,
     with no cropping — portrait photos fill the frame edge to edge,
     landscape photos sit centered with even space above/below. */
  .frame img { width:100%; height:100%; object-fit:contain; display:block; }
  .frame .num { position:absolute; top:8px; left:8px; font-family:monospace; color:#888; font-size:0.75rem; }
  .frame .cap { position:absolute; bottom:8px; left:8px; font-family:monospace; font-size:0.7rem; color:#eee; background:rgba(0,0,0,0.55); padding:2px 6px; }
  .empty { font-family:monospace; color:#666; padding:40px 0; }

  /* Lightbox (tap a photo to see it full size) */
  .lightbox {
    display:none;
    position:fixed; inset:0; background:rgba(0,0,0,0.9);
    z-index:100; align-items:center; justify-content:center;
    padding:20px;
  }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:100%; max-height:100%; object-fit:contain; }
  .lightbox .close { position:absolute; top:20px; right:30px; color:#eee; font-family:monospace; font-size:1.5rem; cursor:pointer; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 500px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .hero h1 { font-size:2.6rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">A.S.</div>
  <nav>
    <a href="index.html">WORK</a>
    <a href="blog.html">JOURNAL</a>
    <a href="about.html">ABOUT</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<section class="hero">
  <h1>ordinary <span class="accent">streets.</span></h1>
  <p>A working portfolio of street, architecture, and travel photography — shot on a Sony A7III, edited slow, published here.</p>
</section>
<div class="gear">SEL2870 · SEL50F18F · SEL85F18<br>EST. 2026</div>

<main>
  <h2>Selected Work</h2>

  <div class="sub-label">LOCATION</div>
  <div class="tabs" id="tabs-location"></div>
  <div class="tabs-month" id="tabs-month"></div>

  <div class="grid" id="grid"></div>
</main>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="close">&times;</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
// =========================================================
// YOUR PHOTOS — add one entry per photo, anywhere in this list.
// The site sorts by "date" automatically (newest first).
// region must be one of: nb, ns, pe, on, ab, usa, in
// =========================================================
const photos = [
  { file: "new-brunswick/Bird.jpg", title: "Gull with Its Catch", city: "Grand Manan", region: "nb", date: "2026-07-19T09:38" },
  { file: "new-brunswick/Ships.jpg", title: "Foggy Shoreline, Boats at Rest", city: "Grand Manan", region: "nb", date: "2026-07-19T08:15" },
  { file: "new-brunswick/Southwest head volcanic cliffs .jpg", title: "Southwest Head Cliffs", city: "Grand Manan", region: "nb", date: "2026-07-18T18:40" },
  { file: "new-brunswick/Whale watching-1.jpg", title: "Whale Fluke, Diving", city: "Grand Manan", region: "nb", date: "2026-07-18T13:26" },
  { file: "new-brunswick/Whale watching-2.jpg", title: "Whale Tail, Calm Water", city: "Grand Manan", region: "nb", date: "2026-07-18T13:26" },
  { file: "new-brunswick/Seals.jpg", title: "Seal Colony Below the Light", city: "Grand Manan", region: "nb", date: "2026-07-18T10:40" },
  { file: "new-brunswick/Puffin-1.jpg", title: "Puffin, Close Up", city: "Grand Manan", region: "nb", date: "2026-07-18T09:52" },
  { file: "new-brunswick/Puffin-2.jpg", title: "Puffin Trio on the Rocks", city: "Grand Manan", region: "nb", date: "2026-07-18T09:51" },
  { file: "new-brunswick/Razorbill-1.jpg", title: "Razorbill, Standing Watch", city: "Grand Manan", region: "nb", date: "2026-07-18T09:29" },
  { file: "new-brunswick/Razorbill-3.jpg", title: "Razorbill and Puffin, Sharing a Rock", city: "Grand Manan", region: "nb", date: "2026-07-18T09:28" },
  { file: "new-brunswick/Puffin-3.jpg", title: "Puffin, Mid-Call", city: "Grand Manan", region: "nb", date: "2026-07-18T09:26" },
  { file: "new-brunswick/Razorbill-2.jpg", title: "Razorbill in Profile", city: "Grand Manan", region: "nb", date: "2026-07-18T09:25" },
  { file: "new-brunswick/Puffin-4.jpg", title: "Puffin on the Boulder", city: "Grand Manan", region: "nb", date: "2026-07-18T09:01" },
  { file: "new-brunswick/Boat dropping.jpg", title: "Dropping Off at the Weir", city: "Grand Manan", region: "nb", date: "2026-07-18T08:40" },
  { file: "new-brunswick/Hole in the wall.jpg", title: "Hole in the Wall", city: "Grand Manan", region: "nb", date: "2026-07-17T14:28" },
  { file: "new-brunswick/Boat & island.jpg", title: "Ferry Passing the Islets", city: "Grand Manan", region: "nb", date: "2026-07-17T13:49" },
  { file: "new-brunswick/Lighthouse .jpg", title: "Swallowtail Lighthouse", city: "Grand Manan", region: "nb", date: "2026-07-17T13:17" },
  { file: "new-brunswick/Island .jpg", title: "Rocky Cove", city: "Grand Manan", region: "nb", date: "2026-07-17T13:07" },
  { file: "nova-scotia/AS25.jpg", title: "Angled Reflections, Waterfront", city: "Halifax", region: "ns", date: "2026-05-19T10:22" },
  { file: "nova-scotia/AS27.jpg", title: "Tall Ship at the Wharf", city: "Halifax", region: "ns", date: "2026-05-19T10:46" },
  { file: "nova-scotia/AS28.jpg", title: "Queen's Marque, Waterfront Steps", city: "Halifax", region: "ns", date: "2026-05-19T10:47" },
  { file: "nova-scotia/AS30.jpg", title: "Historic Properties Corner", city: "Halifax", region: "ns", date: "2026-05-19T11:10" },
  { file: "nova-scotia/AS32.jpg", title: "Spring Blossoms, Downtown Street", city: "Halifax", region: "ns", date: "2026-05-19T14:53" },
  { file: "nova-scotia/AS33.jpg", title: "Old Town Clock, Citadel Hill", city: "Halifax", region: "ns", date: "2026-05-19T15:01" },
  { file: "nova-scotia/AS35.jpg", title: "View from Citadel Hill", city: "Halifax", region: "ns", date: "2026-05-19T15:16" },
  { file: "nova-scotia/AS36.jpg", title: "Painted Storefront, Downtown Halifax", city: "Halifax", region: "ns", date: "2026-05-19T17:25" },
  { file: "nova-scotia/AS39.jpg", title: "Prince of Wales Tower, Point Pleasant Park", city: "Halifax", region: "ns", date: "2026-05-20T18:17" },
  { file: "nova-scotia/AS41.jpg", title: "Church Spire, Downtown Halifax", city: "Halifax", region: "ns", date: "2026-05-20T15:17" },
];

// Location tabs (province / state / country tier — stays consistent, no cities here)
// Note: no "ALL" tab — default view with no tab active already shows everything.
const locations = [
  { key: "nb",  label: "NEW BRUNSWICK" },
  { key: "ns",  label: "NOVA SCOTIA" },
  { key: "pe",  label: "PRINCE EDWARD ISLAND" },
  { key: "on",  label: "ONTARIO" },
  { key: "ab",  label: "ALBERTA" },
  { key: "usa", label: "USA" },
  { key: "in",  label: "INDIA" },
];

const MONTH_NAMES = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

// activeFilter is either:
//   null                              -> show everything
//   { type: "location", key: "ns" }   -> filter by region
//   { type: "month", key: "2026-05" } -> filter by year-month
let activeFilter = null;
let monthTabsOpen = false;

function getAvailableMonths() {
  const seen = new Map(); // "2026-05" -> { year, month }
  photos.forEach(p => {
    const d = new Date(p.date);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    if (!seen.has(key)) seen.set(key, { year: d.getFullYear(), month: d.getMonth() });
  });
  return [...seen.entries()]
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([key, v]) => ({ key, label: `${MONTH_NAMES[v.month]} ${v.year}` }));
}

function render() {
  const sorted = [...photos].sort((a, b) => new Date(b.date) - new Date(a.date));

  let filtered = sorted;
  if (activeFilter?.type === "location") {
    filtered = sorted.filter(p => p.region === activeFilter.key);
  } else if (activeFilter?.type === "month") {
    filtered = sorted.filter(p => p.date.startsWith(activeFilter.key));
  }

  // Location tabs + GO TO toggle
  document.getElementById("tabs-location").innerHTML =
    locations.map(l => `
      <button class="tab ${activeFilter?.type === "location" && activeFilter.key === l.key ? "active" : ""}" onclick="setLocation('${l.key}')">${l.label}</button>
    `).join("") +
    `<button class="tab goto ${monthTabsOpen ? "open" : ""} ${activeFilter?.type === "month" ? "active" : ""}" onclick="toggleGoTo()">GO TO<span class="chevron">▾</span></button>`;

  // Month sub-tabs
  const months = getAvailableMonths();
  document.getElementById("tabs-month").className = `tabs-month ${monthTabsOpen ? "open" : ""}`;
  document.getElementById("tabs-month").innerHTML = months.length
    ? months.map(m => `
        <button class="tab ${activeFilter?.type === "month" && activeFilter.key === m.key ? "active" : ""}" onclick="setMonth('${m.key}')">${m.label}</button>
      `).join("")
    : `<span class="empty">No dated photos yet.</span>`;

  document.getElementById("grid").innerHTML = filtered.length
    ? filtered.map((p, i) => `
        <div class="frame" onclick="openLightbox('${encodeURI('images/' + p.file)}', '${p.title.replace(/'/g, "\\'")}')">
          <img src="${encodeURI('images/' + p.file)}" alt="${p.title}" loading="lazy">
          <span class="num">${String(i + 1).padStart(2, "0")}</span>
          <span class="cap">${p.title}</span>
        </div>
      `).join("")
    : `<div class="empty">No frames yet for this filter.</div>`;
}

function setLocation(key) {
  activeFilter = { type: "location", key };
  monthTabsOpen = false;
  render();
}

function toggleGoTo() {
  monthTabsOpen = !monthTabsOpen;
  render();
}

function setMonth(key) {
  activeFilter = { type: "month", key };
  monthTabsOpen = false;
  render();
}

function openLightbox(src, alt) {
  document.getElementById("lightbox-img").src = src;
  document.getElementById("lightbox-img").alt = alt;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
}

render();
</script>
</body>
</html>
