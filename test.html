<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Formspree Test</title></head>
<body style="font-family:sans-serif; padding:20px;">
<h2>Formspree Direct Test</h2>
<p>This form has NO JavaScript. It submits straight to Formspree the plain, old-fashioned way. If Formspree is set up correctly, submitting this should take you to a Formspree "thanks" page.</p>
<form action="https://formspree.io/f/xlgqqvze" method="POST">
  <label>Name<br><input type="text" name="name" required></label><br><br>
  <label>Message<br><textarea name="message" required></textarea></label><br><br>
  <button type="submit">Submit Test</button>
</form>
</body>
</html>
